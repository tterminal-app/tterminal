# 不繼承 workspace 欄位:server/Dockerfile 只複製這個 crate(沒有 workspace 根),
# 必須能獨立解析。版本與 core workspace 保持一致。
[package]
name = "tterm-vault"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
