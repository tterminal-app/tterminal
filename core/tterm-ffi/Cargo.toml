[package]
name = "tterm-ffi"
description = "tterminal C ABI(terminal 熱路徑 + vault 低頻 JSON 通道,dart:ffi 直接呼叫)"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"

[lib]
# rlib 讓 integration test 能連結;cdylib/staticlib 給 Flutter 用
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tterm-term = { path = "../tterm-term" }
tterm-session = { path = "../tterm-session" }
tterm-vault = { path = "../tterm-vault" }
tterm-ssh = { path = "../tterm-ssh" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = { workspace = true }

# vault key 存 Keychain(Security.framework 自己宣告,只借 CF 型別與函式)
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
