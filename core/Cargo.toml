[workspace]
resolver = "2"
members = [
    "tterm-term",
    "tterm-ssh",
    "tterm-session",
    "tterm-vault",
    "tterm-ffi",
    "tterm-selftest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
