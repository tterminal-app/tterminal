name: ci

# 每次 push / PR 都跑的測試。打包發佈在 release.yml。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: core
        run: cargo test --release
      - name: Self-test(在真實作業系統上驗證引擎與 PTY / ConPTY)
        working-directory: core
        run: cargo run --release --bin tterm-selftest -- --no-pause

  server:
    name: Sync server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - working-directory: server
        run: cargo test

  app:
    name: Flutter app (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev fonts-noto-cjk
      - name: Build native core
        working-directory: core
        run: cargo build --release -p tterm-ffi
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: app
        env:
          TTERM_FFI_LIB: ${{ github.workspace }}/core/target/release/libtterm_ffi.so
          LANG: en_US.UTF-8
        # paint_cost_test 量 frame 時間,共用 runner 上不穩定,不擋 CI
        run: flutter test --exclude-tags perf
