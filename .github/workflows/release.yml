# 桌面版預編譯:Windows(x64、arm64)、macOS(universal)、Linux(x64、arm64)。
#
#   推 tag v1.2.3  → 全部建置,建一個「草稿」release 附上檔案,確認後再到 GitHub 上按發佈
#   push 到 main / 手動觸發 → 只建置,檔案留在 Actions 的 artifacts(等於每個 commit 的測試版)
#
# Flutter 不能跨架構編譯 Linux / Windows 桌面版,所以 arm64 都用原生的 arm64 runner。
# subosito/flutter-action 在 arm64 的 Linux / Windows 抓不到 SDK(只有 x64 的發佈檔),
# 那兩個 job 改用 git clone 指定版本(Flutter 會自己下載 arm64 的 Dart SDK)。
# 參考:Rio(ubuntu-22.04-arm 原生編 arm64)、Warp / Wave(per-arch 加 AppImage / deb / rpm)。
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 版本號(只用在檔名),例如 1.0.0
        required: false

permissions:
  contents: write

# main 連續推送時只留最新的那次;tag 的建置不取消
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v=${GITHUB_REF_NAME#v}
          elif [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"
          else v="0.0.0-${GITHUB_SHA::7}"; fi
          case "$v" in *[!A-Za-z0-9.+-]*) echo "版本號只能有英數字與 . + -" >&2; exit 1 ;; esac
          echo "value=$v" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          workspaces: |
            core
            packaging/win-launcher
      - if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - if: matrix.arch == 'arm64'
        name: Flutter(git clone,arm64)
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git "$env:RUNNER_TOOL_CACHE\flutter"
          "$env:RUNNER_TOOL_CACHE\flutter\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: 確認 Dart 是這台機器的架構(不然會默默編出 x64)
        shell: pwsh
        run: |
          flutter --version
          $v = dart --version 2>&1 | Out-String
          Write-Host $v
          $want = if ('${{ matrix.arch }}' -eq 'arm64') { 'windows_arm64' } else { 'windows_x64' }
          if ($v -notmatch $want) { throw "Dart 不是 $want" }
      - name: Build
        shell: pwsh
        run: .\scripts\build-windows.ps1 -SkipTests
      - name: Rename
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.value }}'; $a = '${{ matrix.arch }}'
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\tterminal.exe "out\tterminal-$v-windows-$a.exe"
          Copy-Item "dist\tterminal-windows-$a-portable.zip" "out\tterminal-$v-windows-$a-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # 腳本會把 Rust 核心編成 arm64 + x86_64 再 lipo,Flutter release 預設就是 universal。
      # 沒有 Developer ID 憑證,先用 ad-hoc 簽章(使用者第一次要右鍵→打開)。
      - name: Build
        run: scripts/build-macos.sh --skip-tests
      - name: 確認是 universal
        run: |
          lipo -archs dist/tterminal.app/Contents/MacOS/tterminal
          lipo -archs dist/tterminal.app/Contents/MacOS/libtterm_ffi.dylib
          for f in dist/tterminal.app/Contents/MacOS/tterminal dist/tterminal.app/Contents/MacOS/libtterm_ffi.dylib; do
            lipo -archs "$f" | grep -q x86_64 && lipo -archs "$f" | grep -q arm64
          done
      - name: DMG
        run: |
          v=${{ needs.version.outputs.value }}
          mkdir -p out dmg
          ditto dist/tterminal.app dmg/tterminal.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname tterminal -srcfolder dmg -ov -format UDZO "out/tterminal-$v-macos-universal.dmg"
          cp dist/tterminal-macos.zip "out/tterminal-$v-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: out/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # 22.04 編出來的執行檔需要 glibc 2.35 以上(Ubuntu 22.04、Debian 12、Fedora 36 以後)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          workspaces: core
      - if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - if: matrix.arch == 'arm64'
        name: Flutter(git clone,arm64)
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TOOL_CACHE/flutter"
          echo "$RUNNER_TOOL_CACHE/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version && dart --version
      - name: Build
        run: |
          (cd core && cargo build --release -p tterm-ffi)
          (cd app && flutter build linux --release)
      - name: Package
        run: scripts/package-linux.sh ${{ needs.version.outputs.value }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "tterminal ${{ needs.version.outputs.value }}" \
            artifacts/*
